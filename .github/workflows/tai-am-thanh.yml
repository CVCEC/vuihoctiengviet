name: Tải file thu âm từ Google Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nguon-am-thanh/danh-sach.tsv', 'nguon-am-thanh/thu-muc.tsv']

permissions:
  contents: write

jobs:
  tai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải các file còn thiếu
        run: |
          set -e
          n=0
          while IFS=$'\t' read -r id path; do
            case "$id" in ''|\#*) continue;; esac
            out="nguon-am-thanh/$path"
            if [ -s "$out" ]; then echo "Đã có: $path"; continue; fi
            mkdir -p "$(dirname "$out")"
            curl -sSL --retry 3 -o "$out" "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            kind=$(file -b "$out")
            echo "$path -> $kind"
            case "$kind" in
              *Audio*|*MPEG*|*ID3*) n=$((n+1));;
              *) echo "::error::$path không phải file âm thanh (có thể Drive đã đổi quyền chia sẻ)"; rm -f "$out"; exit 1;;
            esac
          done < nguon-am-thanh/danh-sach.tsv
          echo "Đã tải $n file mới"
      - name: Tải cả thư mục (thu-muc.tsv)
        run: |
          set -e
          pip install -q gdown==5.2.0
          while IFS=$'\t' read -r id path; do
            case "$id" in ''|\#*) continue;; esac
            out="nguon-am-thanh/$path"
            if ls "$out"/*.mp3 >/dev/null 2>&1; then echo "Đã có: $path"; continue; fi
            tmp=$(mktemp -d)
            for i in 1 2 3; do gdown --folder "https://drive.google.com/drive/folders/$id" -O "$tmp" --quiet && break || sleep 10; done
            python3 tools/chuan_ten.py "$tmp" "$out"
            rm -rf "$tmp"
          done < nguon-am-thanh/thu-muc.tsv
      - name: Lưu vào kho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nguon-am-thanh
          if git diff --cached --quiet; then echo "Không có gì mới"; else git commit -m "Tải file thu âm từ Google Drive" && git push; fi
