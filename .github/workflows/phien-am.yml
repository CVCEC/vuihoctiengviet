name: Phiên âm file thu âm

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tải file thu âm từ Google Drive"]
    types: [completed]
  push:
    branches: [main]
    paths: ['tools/phien_am.py']

permissions:
  contents: write

concurrency:
  group: phien-am
  cancel-in-progress: false

jobs:
  phien-am:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: pip install faster-whisper==1.1.1
      - run: python tools/phien_am.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nguon-am-thanh
          if git diff --cached --quiet; then echo "Không có gì mới"; else git commit -m "Phiên âm file thu âm" && git pull --rebase && git push; fi
