name: Phiên âm file thu âm

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tải file thu âm từ Google Drive"]
    types: [completed]
  push:
    branches: [main]
    paths: ['tools/phien_am.py']

permissions:
  contents: write

concurrency:
  group: phien-am
  cancel-in-progress: false

jobs:
  phien-am:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
      NSHARD: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: pip install faster-whisper==1.1.1 requests
      - run: python tools/phien_am.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nguon-am-thanh
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "Phiên âm file thu âm (phần $SHARD)"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
