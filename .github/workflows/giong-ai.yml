name: Giọng đọc AI

# Đọc bằng Google Gemini những câu sách không có file thu âm (tools/giong_ai.py).
# Chạy khi giong-ai/chay.txt thay đổi, khi bấm tay, và mỗi ngày một lần để làm tiếp phần còn lại
# (gói miễn phí chỉ có vài lượt gọi mỗi ngày).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['giong-ai/chay.txt', 'giong-ai/bo.txt']
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: giong-ai
  cancel-in-progress: false

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: pip install faster-whisper==1.1.1 requests
      - name: Cài ffmpeg (cắt và nén tiếng)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Cài đặt cho lần chạy (giong-ai/chay.txt)
        run: grep -E '^[A-Z_]+=' giong-ai/chay.txt >> "$GITHUB_ENV" || true
      - name: Đọc các câu còn thiếu tiếng
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/giong_ai.py
